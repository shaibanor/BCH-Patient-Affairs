<style>
:root{--navy:#14506E;--navy-2:#0E3B52;--sky:#27AAE2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,var(--navy-2) 0%,var(--navy) 55%,#1C6C92 100%);color:#fff;display:grid;place-items:center;padding:20px;min-height:100vh;position:relative}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(2px);pointer-events:none}
body::before{width:560px;height:560px;right:-180px;top:-200px;background:radial-gradient(circle,rgba(39,170,226,.32),transparent 65%)}
body::after{width:480px;height:480px;left:-160px;bottom:-200px;background:radial-gradient(circle,rgba(39,170,226,.22),transparent 65%)}
.box{position:relative;z-index:1;width:100%;max-width:400px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;padding:30px 26px 24px;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.brand{background:#fff;border-radius:14px;padding:8px 14px;display:inline-flex;margin-bottom:22px}
.brand img{height:42px;display:block}
.lock{width:74px;height:74px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,#2FB6EE,#1A7FB0);box-shadow:0 14px 30px rgba(39,170,226,.45),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.lock svg{width:36px;height:36px}
.lock .sh{transition:transform .45s cubic-bezier(.2,.8,.2,1);transform-origin:16px 11px}
.open .lock .sh{transform:translateY(-3px) rotate(-28deg)}
.shake .lock{animation:sh .45s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
h1{font-size:21px;margin:0 0 4px}
p{margin:0 0 20px;color:#BFE8FA;font-size:14px}
input{width:100%;font:inherit;font-size:18px;letter-spacing:3px;text-align:center;direction:ltr;padding:13px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.95);color:#10222D;outline:none}
input:focus{border-color:var(--sky);box-shadow:0 0 0 4px rgba(39,170,226,.3)}
button{width:100%;margin-top:12px;font:inherit;font-weight:700;font-size:16px;padding:13px;border:0;border-radius:14px;background:var(--sky);color:#fff;cursor:pointer}
button:disabled{opacity:.7;cursor:wait}
.rem{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:13px;color:#BFE8FA}
.rem input{width:auto;margin:0}
.err{min-height:22px;margin-top:10px;font-size:13.5px;color:#FFC9C4;font-weight:600}
.foot{margin-top:14px;font-size:12px;color:#8FB8CC}
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = "pa_dash_pw";
async function unlock(pw){
  const salt = b64(P.s), iv = b64(P.i), data = b64(P.d);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:P.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, data);
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }
const f = document.getElementById("f"), pw = document.getElementById("pw"), go = document.getElementById("go"), err = document.getElementById("err"), rm = document.getElementById("rm");
async function attempt(code, remember){
  go.disabled = true; go.textContent = "جارٍ التحقق…"; err.textContent = "";
  try{
    const html = await unlock(code.trim());
    if(remember){ try{ localStorage.setItem(KEY, code.trim()); }catch(_){} }
    f.classList.add("open");
    setTimeout(()=>show(html), 380);
    return true;
  }catch(e){
    try{ localStorage.removeItem(KEY); }catch(_){}
    err.textContent = "الرمز غير صحيح. حاول مرة أخرى.";
    f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
    go.disabled = false; go.textContent = "دخول"; pw.select();
    return false;
  }
}
f.addEventListener("submit", e => { e.preventDefault(); if(pw.value.trim()) attempt(pw.value, rm.checked); });
if(!window.crypto || !crypto.subtle){ err.textContent = "افتح الصفحة من متصفح حديث عبر رابط https."; go.disabled = true; }
else { let saved=null; try{ saved = localStorage.getItem(KEY); }catch(_){} if(saved) attempt(saved, true); else pw.focus(); }
</script>
